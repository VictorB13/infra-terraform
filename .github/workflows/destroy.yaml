name: Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: .
  SSM_PREFIX: /todo-app

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 644 ~/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: |
          terraform destroy -input=false -auto-approve \
            -var="bucket_name=${{ vars.BUCKET_NAME || 'todo-app-tfstate-victor' }}" \
            -var="public_key_path=$HOME/.ssh/id_rsa.pub"

      - name: Delete SSM instance parameters
        run: |
          set -euo pipefail
          for name in ec2_public_ip ec2_public_dns ssh_user kubeconfig argocd_admin_password argocd_url postgres_password jwt_secret; do
            PARAM="${SSM_PREFIX}/${name}"
            if aws ssm get-parameter --name "$PARAM" >/dev/null 2>&1; then
              aws ssm delete-parameter --name "$PARAM"
              echo "Deleted $PARAM"
            else
              echo "Skip (not found): $PARAM"
            fi
          done
