name: Build Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: .
  ANSIBLE_REPO: VictorB13/infra-ansible
  SSM_PREFIX: /todo-app
  SSH_USER: ubuntu

jobs:
  build:
    name: Terraform Apply & Ansible Provision
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Terraform repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Write SSH key pair
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null

      # S3/DynamoDB must exist before `terraform init` with the S3 backend.
      # This step creates them if missing (idempotent).
      - name: Bootstrap Terraform state backend (S3 + DynamoDB)
        env:
          BUCKET_NAME: ${{ vars.BUCKET_NAME || 'todo-app-tfstate-victor' }}
          DYNAMODB_TABLE: todo-app-terraform-locks
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "S3 bucket already exists: $BUCKET_NAME"
          else
            echo "Creating S3 bucket: $BUCKET_NAME"
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          if aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" >/dev/null 2>&1; then
            echo "DynamoDB table already exists: $DYNAMODB_TABLE"
          else
            echo "Creating DynamoDB table: $DYNAMODB_TABLE"
            aws dynamodb create-table \
              --table-name "$DYNAMODB_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$DYNAMODB_TABLE"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false -out=tfplan \
            -var="bucket_name=${{ vars.BUCKET_NAME || 'todo-app-tfstate-victor' }}" \
            -var="public_key_path=$HOME/.ssh/id_rsa.pub"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read EC2 outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: tf_out
        run: |
          IP="$(terraform output -raw ec2_public_ip)"
          DNS="$(terraform output -raw ec2_public_dns)"
          echo "ec2_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "ec2_dns=$DNS" >> "$GITHUB_OUTPUT"
          echo "EC2 public IP: $IP"
          echo "EC2 public DNS: $DNS"

      - name: Checkout Ansible repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANSIBLE_REPO }}
          path: infra-ansible
          

      - name: Setup Python & Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip sshpass
          pip3 install --user "ansible-core>=2.14,<2.18"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Wait for SSH
        run: |
          IP="${{ steps.tf_out.outputs.ec2_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 36); do
            if ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              ubuntu@"$IP" 'echo ready'; then
              echo "SSH is up"
              exit 0
            fi
            echo "Attempt $i/36 — retrying in 10s..."
            sleep 10
          done
          echo "SSH did not become ready in time"
          exit 1

      - name: Write Ansible inventory
        working-directory: infra-ansible
        env:
          EC2_IP: ${{ steps.tf_out.outputs.ec2_ip }}
        run: |
          printf '%s\n' \
            'all:' \
            '  children:' \
            '    k3s:' \
            '      hosts:' \
            '        k3s-node:' \
            "          ansible_host: ${EC2_IP}" \
            '          ansible_user: ubuntu' \
            "          ansible_ssh_private_key_file: ${HOME}/.ssh/id_rsa" \
            > /tmp/k3s-inventory.yml
          cat /tmp/k3s-inventory.yml

      - name: Run Ansible (packages → k3s → hardening)
        working-directory: infra-ansible
        run: |
          ansible-playbook playbooks/site.yml \
            -i /tmp/k3s-inventory.yml \
            -e "k3s_tls_san=${{ steps.tf_out.outputs.ec2_ip }}"

      - name: Store instance connection info in SSM Parameter Store
        env:
          EC2_IP: ${{ steps.tf_out.outputs.ec2_ip }}
          EC2_DNS: ${{ steps.tf_out.outputs.ec2_dns }}
        run: |
          set -euo pipefail
          IP="$EC2_IP"

          # Fetch kubeconfig from the node (written by the k3s Ansible role)
          scp -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ubuntu@"$IP":/home/ubuntu/.kube/config /tmp/kubeconfig

          # Point API server at localhost so local kubectl works over an SSH tunnel
          # (6443 is not public). Keep a copy as stored on the node too.
          cp /tmp/kubeconfig /tmp/kubeconfig-ssm
          # Ensure server URL is localhost for tunnel use
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|' /tmp/kubeconfig-ssm

          aws ssm put-parameter \
            --name "${SSM_PREFIX}/ec2_public_ip" \
            --type String \
            --value "$EC2_IP" \
            --overwrite

          aws ssm put-parameter \
            --name "${SSM_PREFIX}/ec2_public_dns" \
            --type String \
            --value "$EC2_DNS" \
            --overwrite

          aws ssm put-parameter \
            --name "${SSM_PREFIX}/ssh_user" \
            --type String \
            --value "$SSH_USER" \
            --overwrite

          aws ssm put-parameter \
            --name "${SSM_PREFIX}/kubeconfig" \
            --type SecureString \
            --value "$(cat /tmp/kubeconfig-ssm)" \
            --overwrite

          echo "Stored SSM parameters under ${SSM_PREFIX}/"
          aws ssm get-parameters-by-path --path "$SSM_PREFIX" --query 'Parameters[].Name' --output text

      - name: Show Terraform outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
